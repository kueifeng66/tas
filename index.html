<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="styles.css" rel="stylesheet">
  <title>Automatic Schedule on Duty</title>
  <script defer src="script.js"></script>
</head>
<body>

  <div class="container">
    <h1>自動排班系統</h1>

    <div class="people-section">
      <h2>人員設定</h2>
      <div id="peopleList"></div>
    </div>


    <div class="controls">
      <div class="month-selector">
        <label for="yearSelect">年份:</label>
        <select id="yearSelect"></select>
        <label for="monthSelect">月份:</label>
        <select id="monthSelect"></select>
      </div>
      <input type="text" id="holidayInput" placeholder="e.g., 1,10,20" />
      <button onclick="updateHolidays()">設定國定假日</button>
      <button onclick="generateBestSchedule()">生成排班表</button>
      <button onclick="resetSchedule()">重置</button>
    </div>

    <div id="messageArea"></div>


    <div id="progressContainer" style="display: none; margin: 10px 0;">
      <label for="progressBar">產生排班進度：</label>
      <progress id="progressBar" value="0" max="100" style="width: 100%; height: 20px;"></progress>
    </div>


    <div class="legend">
      <div class="legend-item">
        <div class="legend-color" style="background: #fef0f5;"></div>
        <span>放假日</span>
      </div>
    </div>

    <div class="preassign-legend">
      <p title="直接點選日曆中任一天的區塊即可指定">📅 請點擊日曆中的日期方格，預先指定最多兩位人員</p>
    </div>

    <div id="calendar" class="calendar"></div>

    <div class="statistics" id="statistics"></div>
  </div>
  <div id="preassignModal" class="modal">
  <div class="modal-content">
    <h3>指定預排人員</h3>
    <p id="modalDayText"></p>
    <label>人員 1：
      <select id="person1Select">
        <option value="">-- 請選擇 --</option>
      </select>
    </label>
    <br>
    <label>人員 2：
      <select id="person2Select">
        <option value="">-- 請選擇 --</option>
      </select>
    </label>
    <br>
    <label>人員 3：
      <select id="person3Select">
        <option value="">-- 請選擇 --</option>
      </select>
    </label>
    <div class="modal-actions">
      <button onclick="savePreassignment()">確定</button>
      <button onclick="closePreassignModal()">取消</button>
    </div>
  </div>
</div>

</body>
</html>
